; Конфигурация команды ./console update

[update]

; Дистрибутив по умолчанию (если не передан аргументом)
distr.zip = https://github.com/Qlaster/Quark/archive/refs/heads/main.zip
distr.git = https://github.com/Qlaster/Quark.git

; Маркеры платформы — проверяем и в дистрибутиве, и в цели,
; иначе рискуем слить в чужую директорию
rootmarker.1 = index.php
rootmarker.2 = .env
rootmarker.3 = app
rootmarker.4 = engine

; Маски игнорирования — файлы дистрибутива, не входящие в план
ignore.1 = public/*
ignore.2 = backups/*
ignore.3 = app/logs/*
ignore.4 = .update/*
ignore.5 = .git/*

; Маски слияния — конфиги: структура новая, значения пользователя
merge.1 = *.ini
merge.2 = *.env
