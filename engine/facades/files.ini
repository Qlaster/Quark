[media]
#Директория, из которой индексировать и показывать файлы
folder = public
#Директория, куда загружать файлы
upload = public/media
#Сгенерировать уникальное имя для загружаемого файла
unique =
#Указывает, что файлы нужно раскладывать по директориям текущей даты
groupdate = 1

[jail]
;Проверка, что путь операции не выходит за разрешённые директории
;корень проекта + системный temp + дополнительные root[]
;Флаг 1 = метод проверяет путь перед выполнением; пусто/0 = как раньше
remove = 1
tree = 1
listing = 1
listingDir = 1
collection = 1
exists = 1
uploadMove = 1
uploadMoveSingleFile = 1
info = 1
;Дополнительные разрешённые директории, например:
;root.0 = "/var/www/shared"
;root.1 = "/mnt/storage"

