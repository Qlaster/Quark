[db]
pdo     = "sqlite:engine/database/users.sqlite"
table   = "users"
presets = "presets"

[default_user]
name = "Root user"
login = "admin"
password = "quark"

[session]
; Новый id сессии при логине (защита от session fixation)
regenerate-id = true
; Время жизни сессии в секундах; 0 = наследовать php.ini/.htaccess
lifetime = 0

