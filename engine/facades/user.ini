[db]
pdo     = "sqlite:engine/database/users.sqlite"
table   = "users"
roles   = "roles"

[default_user]
name = "Root user"
login = "admin"
password = "quark"

[session]
; Имя сессионной куки (плоское имя; своя кука — не делимся PHPSESSID с чужими приложениями)
name = "qsession"
; Новый id сессии при логине (защита от session fixation)
regenerate-id = true
; Время жизни сессии в секундах; 0 = наследовать php.ini/.htaccess
lifetime = 0
; Название переменных для хранения логина и сигнатуры
login = "qlogin"
signature = qsignature

[policy]
;Разрешенный диапазон ip (может быть массив json: = ["1.2.3.4", "2.3.*.?"])
ip.allow  = "*.*.*.*"
;Количество неудачных попыток входа для перманентного бана по ip
ip.ban    = 0
;Время бана ip, минут (0 — перманентно)
ip.bantime = 0

;Пароли: минимальная длина, обязательные классы символов, алгоритм
password.length  = 8
;lower,upper,digit,symbol
password.classes = ["lower","digit"]
;md5, bcrypt, argon2i, argon2id
password.hash    = "default"

;Локальная блокировка пользователя: N неверных паролей → блок на M минут
lock.attempts   = 8
lock.minutes    = 5


[log]
enable = 1
