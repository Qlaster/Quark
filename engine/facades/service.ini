#Фасад управления службами

[service]
;Директория с файлами служб
path    = "app/services"

;Директория логов служб (stdout/stderr демонов, start >> file)
logs    = "app/logs/services"

;Префикс заголовка процесса: cli_set_process_title + сигнатура при скане
title   = "quark:service"

;Переписывать $argv для службы как у отдельной команды ($argv[0] = имя)
limpid  = 1

;Секунд ожидания остановки после SIGTERM перед SIGKILL
timeout = 5
