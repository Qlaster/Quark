#Вкл/выкл
enable = 1
#Директория для хранения логов. Используете %TEMP%, для временной директории
folder = "app/logs/traffic"
#Разделитель
delimiter = "		"
#Название куки с маркером пользователя
marker = "qmark"
#Название куки-флага для уникального пользователя
unique = 'quid'
#Маска при создании файла
umask = 0755
#Размер буфера чтения лога (макс. размер 1 строки в байтах)
bufsize = 65568
#Маскировочный паттерн
ink = ▐░░░▌


#Секция, в которой указывается название переменных,
#которые требуется вложить в лог визита
[attach]
_SESSION.qlogin = 1


#Секция цензуры: пути к значениям, которые закрашиваются.
#_GET — маскирует и uri в логе; _SESSION и пр. — внутри attach-дампа.
#Вложенность — точками: _SESSION.user.token → $_SESSION['user']['token']
#Примеры
#_GET.token          = 1
#_SESSION.secret      = 1
[censor]

