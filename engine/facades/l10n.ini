;Локализация интерфейса: данные помечаются ключом l10n,
;фасад подменяет поля переводами из app/l10n/{lang}.ini

[translate]
;Включить локализацию
enable = 1
;Язык оригинала — исходные значения в данных/конфигах
source = "ru"
;Целевой язык по умолчанию (на запрос переопределяется $APP->l10n->lang())
lang   = "ru"
;Каталог локалей: {folder}/{lang}.ini, опционально {folder}/{lang}/*.ini
folder = "app/l10n"
;Имя маркера в структурах данных: node['l10n'] = 'zone:type:name'
key    = "l10n"

[auto]
;Поля, переводимые машинно при $APP->l10n->auto() (если список не передан)
;autofields = head,text,title
;Нормализация при поиске в словарной секции [auto] локали:
;trim — обрезать пробелы у значения и ключей словаря
;lowercase — регистронезависимый поиск (осторожно: IP, OK, имена)
trim      = 1
lowercase = 0

[collect]
;Собирать промахи в память ($APP->l10n->missing()) — корм для редактора
;переводов. Персистентность решает вызывающий контроллер, фасад файлы не пишет
missing = 0


