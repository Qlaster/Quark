#=============================================================
#		C A T A L O G    C O N F I G
#=============================================================
# Секции файла:
#	[view]     — параметры таблицы в админке (limit, range)
#	[upload]   — загрузка файлов каталогов
#	[patterns] — подписи типов полей для админки
#	[list]     — описание каталогов
#	[access]   — разрешения на операции с записями каталогов
#	[denied]   — запреты (приоритет выше, чем access)
#
#──────────────────────────[ list ]───────────────────────────
# Описание каталога:
#	<имя>.db    = "подключение БД"
#	<имя>.table = "таблица"
#	<имя>.head  = "заголовок в админке"
#	<имя>.info  = "описание"
#	<имя>.help  = "подсказка администратору"
#	<имя>.icon  = "fa-класс иконки"
#	<имя>.refresh = секунды — интервал проверки обновлений
#
# Отбор записей при просмотре:
#	<имя>.events.view.column / groupby / orderby / where
#
# Поля каталога:
#	<имя>.field.<поле>.alias  = "подпись поля"
#	<имя>.field.<поле>.type   = "тип (см. [patterns])"
#	<имя>.field.<поле>.source = "db::table::field" (для relation)
#	<имя>.field.<поле>.input  = "нативный тип input"
#	<имя>.field.<поле>.ignore = 1  (скрыть в таблице view)
#
#────────────────────────[ access ]───────────────────────────
# Права описываются блоками субъектов:
#
#	<catalog>.<субъект>.ops = '["select","update"]'
#
# Субъект — логин пользователя или маска логина:
#	*         — все пользователи
#	admin-*   — логины по маске (fnmatch: *, ?)
#	ivan..petrov — логин с точкой (точка удваивается)
#
# Атрибуты блока:
#	ops    = '["select","insert","update","delete","replace"]' — операции
#	         (обязателен; "*" — все операции сразу)
#	fields = '["name","price","pr*"]'   — поля (JSON-массив масок,
#	                                    по умолчанию ["*"])
#	where  = 'sql-фрагмент'             — ограничение записей
#	                                    (тот же SQL, что events.view.where)
#
# fields и where могут задаваться по-операционно — спецификация
# для конкретной операции через вложенный ключ:
#
#	<catalog>.<субъект>.fields.update = '["name"]'
#	<catalog>.<субъект>.where.update  = 'created > datetime("now","-1 day")'
#
# Безусловные формы (fields, where как строки) — то же самое,
# что fields.* и where.*:
#
#	books.ivan..petrov.where      = 'id > 0'
#		равнозначно
#	books.ivan..petrov.where.*    = 'id > 0'
#
# Семантика:
#	— секция [access] отсутствует → поведение как раньше (всё открыто)
#	— несколько совпавших масок субъекта → правила объединяются
#	— where.* и where.<op> складываются через AND
#	— fields.<op> перекрывает fields.* для этой операции
#	— секция [denied] зеркальна [access] и проверяется ПЕРВОЙ:
#	  любое совпадение = запрет
#
# Пример:
#	books.*.ops = '["select"]'                              ; все видят
#	books.editor-*.ops = '["select","update"]'              ; редакторы правят
#	books.editor-*.fields = '["name","price"]'              ; только эти поля
#	books.editor-*.where.update = 'created > datetime("now","-1 day")' ; и только свежие
#	books.admin-*.ops = '["*"]'                             ; админам всё
#	ivan-temp в [denied] перекроет любые разрешения
#
#─────────────────────────[ denied ]──────────────────────────
# Та же грамматика, что [access]. Совпадение любого правила
# отменяет соответствующее разрешение:
#
#	books.ivan-temp.ops = '["update","delete"]'
#	books.*.fields      = '["salary","cost"]'  ; поля-запреты для всех
#
#=============================================================


[view]
range = 15
limit = 50


[upload]
#Диреткория загрузки файлов
folder = public/catalogs/
#переименовывать загружаемые файлы в уникальные имена
renaming = false


[patterns]
# sql — тип колонки для ALTER TABLE ADD COLUMN (новое поле каталога)
text.head = "Текст"
text.sql  = "TEXT"
int.head = "Целое число"
int.sql  = "INTEGER"
real.head = "Целое или дробное число"
real.sql  = "REAL"
html.head = "HTML код"
html.sql  = "TEXT"
link.head = "Ссылка"
link.sql  = "TEXT"
image.head = "Ссылка на картинку"
image.sql  = "TEXT"
video.head = "Ссылка на видео"
video.sql  = "TEXT"
audio.head = "Ссылка на аудио"
audio.sql  = "TEXT"
blob.head = "Бинарные данные"
blob.sql  = "BLOB"
check.head = "Переключатель"
check.sql  = "INTEGER DEFAULT 0"
date.head = "Дата"
date.sql  = "TEXT"
datetime.head = "Дата и время"
datetime.sql  = "TEXT"
checkdate.head = "Флажок с датой"
checkdate.sql  = "TEXT"
input.head = "Нативный input"
input.sql  = "TEXT"
files.head = "Файлы"
files.sql  = "TEXT"
relation.head = "Связь с другим каталогом"
relation.sql  = "INTEGER"

[list]
#Условия подключения
account.db = "account"
account.table = "account"
account.icon = "fa-user"
account.head = "Аккаунты пользователей"
account.info = "Список учетных записей базы аккаунтов"
account.help = "При внесении новых пользователей обеспечте уникальность их адресов электронной почты"
#Интервал в секундах, для проверки обновлений, когда каталог открыт
account.refresh = 10

#События отбора
account.events.view.column =
account.events.view.groupby =
account.events.view.orderby =
account.events.view.where =
#Описание полей
account.field.id.type = "id"
account.field.login.alias  = "Логин"
account.field.login.type  = "text"
account.field.name.alias  = "Имя"
account.field.name.type  = "text"
account.field.head.alias  = "Заголовок"
account.field.head.type  = "text"
account.field.image.alias  = "Логотип"
account.field.image.type  = "image"
#account.field.access.alias  = "Права"
#account.field.access.type  = "select"
#account.field.access.source  = access.name
account.field.info.alias  = "Описание"
account.field.info.type  = "html"

account.field.online.alias  = "Онлайн"
account.field.online.type  = "integer"
account.field.online.type  = "check"

account.field.disable.alias  = "Блокировка"
account.field.disable.type  = "check"
account.field.docs.alias  = "Файлы"
account.field.docs.type  = "files"
account.field.audio.alias = Ролик
account.field.audio.type = audio
#Классический input с возможностью передать любой нативный тип
account.field.color.alias = Цвет
account.field.color.type = input
account.field.color.input = color

