#─────────────────────────[ access ]──────────────────────────
# Разрешения субъектов на операции с записями каталогов.
# Синтаксис см. в шапке файла. Пустая секция — поведение как
# раньше: всё открыто для всех.
[access]


#─────────────────────────[ denied ]──────────────────────────
# Запреты. Та же грамматика, что [access]. Проверяется первой:
# любое совпадение отменяет соответствующее разрешение.
[denied]
