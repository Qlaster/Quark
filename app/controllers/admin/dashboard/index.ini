;Статическая структура страницы Dashboard — источник данных GUI.
;Локализация: маркеры l10n + секции в app/l10n/{lang}.ini

[view]
title = 'Панель состояния'
l10n  = 'admin:dashboard'

;Виджеты-счётчики (text заполняется из кода)
widgets.list.page.head   = 'Страниц'
widgets.list.page.l10n   = 'admin:dashboard:page'
widgets.list.users.head  = 'Пользователей'
widgets.list.users.l10n  = 'admin:dashboard:users'
widgets.list.db.head     = 'Баз данных'
widgets.list.db.l10n     = 'admin:dashboard:db'

;График посещаемости
graph.head  = 'Статистика посещаемости ресурса за последние дни'
graph.text  = "<label class='label label-primary'>Зеленым</label> отмечены уникальные пользователи, <label class='label label-default'>серым</label> - объем страниц, который они посетили"
graph.l10n  = 'admin:dashboard:graph'

;Заголовки и кнопки статики в шаблоне — узлы с полями
charts.l10n      = 'admin:dashboard:charts'

charts.buttons.list.d10.head   = '10 дней'
charts.buttons.list.d10.count  = 10
charts.buttons.list.d10.l10n   = 'admin:dashboard:btn10'
charts.buttons.list.d20.head   = '20 дней'
charts.buttons.list.d20.count  = 20
charts.buttons.list.d20.l10n   = 'admin:dashboard:btn20'
charts.buttons.list.d30.head   = '30 дней'
charts.buttons.list.d30.count  = 30
charts.buttons.list.d30.l10n   = 'admin:dashboard:btn30'

charts.titles.list.devices.head   = 'Устройства'
charts.titles.list.devices.l10n   = 'admin:dashboard:devices'
charts.titles.list.os.head        = 'Операционные системы'
charts.titles.list.os.l10n        = 'admin:dashboard:os'
charts.titles.list.browsers.head  = 'Браузеры'
charts.titles.list.browsers.l10n  = 'admin:dashboard:browsers'
