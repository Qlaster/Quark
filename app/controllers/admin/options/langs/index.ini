[view]
title.head = 'Языки'
title.l10n = 'admin:options:langs:title'

;Список локалей системы (engine/facades/l10n.ini, секция [locales])
form.langs.head     = 'Доступные языки'
form.langs.info     = 'Отметьте языки, доступные для выбора в интерфейсе и переключателях документов. Список объявлен в engine/facades/l10n.ini, секция [locales] — запись идёт туда же.'
form.langs.empty    = 'Секция [locales] пуста — языки не объявлены'
form.langs.action   = 'admin/options/langs'
form.langs.l10n     = 'admin:options:langs'

;Колонки таблицы
form.langs.cols.enable  = 'Доступен'
form.langs.cols.lang    = 'Язык'
form.langs.cols.code    = 'Код'
form.langs.cols.files   = 'Файлы переводов'
form.langs.cols.l10n    = 'admin:options:langs:cols'

;Файлы локали на диске
form.langs.files.yes   = 'есть'
form.langs.files.no    = 'нет'
form.langs.files.l10n  = 'admin:options:langs:files'

form.langs.save.head = 'Сохранить'
form.langs.save.icon = 'fa fa-check'
form.langs.save.l10n = 'admin:options:langs:save'

;Сообщения результата — контроллер подставляет один как message.main
message.ok.text    = 'Сохранено'
message.ok.class   = 'text-success'
message.err.text   = 'Не удалось записать engine/facades/l10n.ini'
message.err.class  = 'text-danger'
message.l10n       = 'admin:options:langs:messages'

;Настройки локализации — секция [translate] l10n.ini
form.settings.head   = 'Настройки локализации'
form.settings.info   = 'Файлы переводов лежат в app/l10n: по одному {lang}.ini на язык, необязательный каталог {lang}/ с ini-файлами — при загрузке они сливаются в одну локаль.'
form.settings.action = 'admin/options/langs'
form.settings.l10n   = 'admin:options:langs:settings'

form.settings.fields.enable.head = 'Включить локализацию (мультиязычный режим)'
form.settings.fields.lang.head   = 'Язык интерфейса по умолчанию'
form.settings.fields.lang.info   = 'Целевой язык перевода, если явный выбор не задан'
form.settings.fields.cookie.head = 'Cookie-ключ выбора языка сайта'
form.settings.fields.cookie.info = 'Имя cookie, в которой фронт хранит выбор посетителя'
form.settings.fields.l10n = 'admin:options:langs:fields'

form.settings.save.head = 'Сохранить'
form.settings.save.icon = 'fa fa-check'
form.settings.save.l10n = 'admin:options:langs:save'
