save.head  = 'Сохранить'
save.title = 'Сохранить изменения'
save.icon  = 'fa-check-square-o'
save.l10n  = 'admin:head:save'

help.head = 'Фрагменты кода на страницах'
help.text = 'Каждая вкладка — фрагмент кода, привязанный к якорю. Код вставляется в шаблон страницы перед указанной строкой дословно: какой якорь написан — такой и ищется. Например, якорь &lt;/head&gt; добавит код перед &lt;/head&gt;, а &lt;/body&gt; — в конец страницы. Якорем может быть и любая другая строка шаблона, например комментарий &lt;!--mark--&gt;.'
help.l10n = 'admin:head:help'

tabs.add        = 'Добавить якорь'
