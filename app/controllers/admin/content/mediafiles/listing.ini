[upload]
#Поддиректория в public, куда загружать файлы
dir = media
#Сгенерировать уникальное имя для загружаемого файла
unique =
#Указывает, что файлы нужно раскладывать по директориям текущей даты
groupdate = 1

[cache]
key = quark:mediafiles
time = 5000

;Статическая структура страницы — источник данных GUI.
;Локализация: маркеры l10n + секции в app/l10n/{lang}.ini
[view]
head  = 'Медиа'
l10n  = 'admin:mediafiles'

;Кнопки тулбара — итерируются foreach $button, имя узла = CSS/JS-хук
button.btn-reload.head  = 'Обновить'
button.btn-reload.icon  = 'fa-refresh'
button.btn-reload.l10n  = 'admin:mediafiles:reload'

button.btn-delete.icon     = 'fa-trash-o'
button.btn-delete.l10n     = 'admin:mediafiles:delete'

;Отдельные элементы управления (не в foreach)
ctrl.upload.head   = 'Загрузить файл'
ctrl.upload.l10n   = 'admin:mediafiles:upload'

ctrl.index.head    = 'Индексировать'
ctrl.index.run     = 'Обновление'
ctrl.index.l10n    = 'admin:mediafiles:index'

ctrl.delfile.title    = 'Удалить файл'
ctrl.delfile.confirm  = 'Вы уверены, что хотите выполнить это действие?'
ctrl.delfile.l10n     = 'admin:mediafiles:delete'

;Меню формата отображения (ссылки динамические — в коде)
menu.format.list.grid.icon   = 'fa-th-large'
menu.format.list.grid.head   = 'Плитка'
menu.format.list.grid.l10n   = 'admin:mediafiles:format:grid'
menu.format.list.table.icon  = 'fa-th-list'
menu.format.list.table.head  = 'Таблица'
menu.format.list.table.l10n  = 'admin:mediafiles:format:table'

;Поиск
form.filter.like.placeholder = 'Поиск: имя файла + enter'
form.filter.like.l10n        = 'admin:mediafiles:search'

;Сводная информация (числа — динамика, подписи — статика)
files.stat.count.icon    = 'fa fa-paperclip'
files.stat.count.suffix  = 'файлов'
files.stat.count.l10n    = 'admin:mediafiles:stat:count'
files.stat.size.icon     = 'fa fa-hdd-o'
files.stat.size.suffix   = 'занято'
files.stat.size.l10n     = 'admin:mediafiles:stat:size'

;Колонки таблицы/дерева — секция подменяет поля list.*
table.cols.l10n              = 'admin:mediafiles:cols'
table.cols.list.name.head     = 'Название'
table.cols.list.size.head     = 'Размер'
table.cols.list.path.head     = 'Путь'
table.cols.list.type.head     = 'Тип'
table.cols.list.modified.head = 'Изменено'
