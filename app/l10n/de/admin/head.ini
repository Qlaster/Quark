[admin:head:index]
title = "Fragmente"
[admin:head:save]
head  = "Speichern"
title = "Änderungen speichern"
[admin:head:help]
head = "Code-Fragmente der Seite"
text = "Jeder Reiter ist ein Code-Fragment, das an einen Anker gebunden ist. Der Code wird direkt vor der angegebenen Zeichenkette in das Seiten-Template eingefügt — der Anker wird wörtlich verglichen. Zum Beispiel fügt der Anker &lt;/head&gt; Code vor &lt;/head&gt; ein, und &lt;/body&gt; hängt ihn an das Ende der Seite an. Jede beliebige Template-Zeichenkette kann als Anker dienen, z. B. ein Kommentar &lt;!--mark--&gt;."
[admin:head:tabs]
add        = "Anker hinzufügen"
del        = "Löschen"
tagname    = "Einfüge-Anker (z. B.: &lt;/head&gt;, &lt;/body&gt;, &lt;/footer&gt;)"
delconfirm = "Diesen Reiter und seinen Code löschen?"
[admin:head:toast]
error = "Ein Fehler ist aufgetreten"
[admin:content:head:save:error]
text = "Ein Fehler ist aufgetreten"
[admin:content:head:del:error]
text = "Ein Fehler ist aufgetreten"
