[admin:head:index]
title = "Fragments"
[admin:head:save]
head  = "Save"
title = "Save changes"
[admin:head:help]
head = "Page code fragments"
text = "Each tab is a code fragment bound to an anchor. The code is inserted into the page template right before the given string — the anchor is matched literally. For example, the &lt;/head&gt; anchor inserts code before &lt;/head&gt;, and &lt;/body&gt; appends it to the end of the page. Any template string can be an anchor, e.g. a comment &lt;!--mark--&gt;."
[admin:head:tabs]
add        = "Add anchor"
del        = "Delete"
tagname    = "Insertion anchor (e.g.: &lt;/head&gt;, &lt;/body&gt;, &lt;/footer&gt;)"
delconfirm = "Delete this tab and its code?"
[admin:head:toast]
error = "An error occurred"
[admin:content:head:save:error]
text = "An error occurred"
[admin:content:head:del:error]
text = "An error occurred"

